# Sample CI workflow — not installed under .github/workflows (token lacks workflow scope).
# Copy to .github/workflows/ci.yml if you want CI on your fork.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
